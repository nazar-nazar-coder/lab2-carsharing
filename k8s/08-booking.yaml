apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: carsharing-gitops
  labels:
    app: booking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      enableServiceLinks: false
      initContainers:
      - name: wait-for-dependencies
        image: busybox:1.36
        command:
        - sh
        - -c
        - until nc -z db 5432 && nc -z redis 6379; do echo waiting; sleep 2; done
      containers:
      - name: booking-service
        image: carsharing-booking:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3003
        env:
        - name: PORT
          value: "3003"
        envFrom:
        - configMapRef:
            name: carsharing-config
        - secretRef:
            name: carsharing-secret
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 192Mi
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: carsharing-gitops
spec:
  selector:
    app: booking-service
  ports:
  - port: 3003
    targetPort: 3003