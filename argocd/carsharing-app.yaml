# ArgoCD Application: бажаний стан платформи каршерінгу береться з гілки lab7-gitops
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: carsharing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nazar-nazar-coder/lab2-carsharing.git
    targetRevision: lab7-gitops
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: carsharing-gitops
  syncPolicy:
    automated:
      prune: true      # видаляти ресурси, яких більше немає в Git
      selfHeal: true   # повертати ручні зміни в кластері до стану з Git
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 10
